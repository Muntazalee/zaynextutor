<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course · Zaynextutor</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
</head>
<body class="has-sidebar">
  <aside class="glass-sidebar">
    <div class="sidebar-brand" id="brand-logo-slot">
            <span class="brand-text"><span class="brand-word">zayn<span class="brand-accent">ex</span></span><span class="brand-sub">TUTOR</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="discover.html" data-nav>Discover</a>
      <a href="my-learning.html" data-nav data-auth-only style="display:none;">My Learning</a>
      <a href="teach.html" data-nav data-auth-only style="display:none;">Teach</a>
      <a href="profile.html" data-nav data-auth-only style="display:none;">Profile</a>
    </nav>
    <div class="sidebar-user" data-auth-only style="display:none;">
      <div class="avatar" data-user-initial>?</div>
      <span data-user-name>User</span>
    </div>
    <div class="sidebar-user" data-guest-only>
      <a href="login.html" style="font-weight:700;">Sign In</a>
    </div>
  </aside>

  <div class="mobile-topbar">
    <div class="mobile-topbar-brand">
            <span class="brand-text"><span class="brand-word">zayn<span class="brand-accent">ex</span></span><span class="brand-sub">TUTOR</span></span>
    </div>
    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Menu">&#9776;</button>
  </div>
  <div id="mobile-menu-dropdown" class="mobile-menu-dropdown">
      <a href="discover.html" data-nav>Discover</a>
      <a href="my-learning.html" data-nav data-auth-only style="display:none;">My Learning</a>
      <a href="teach.html" data-nav data-auth-only style="display:none;">Teach</a>
      <a href="profile.html" data-nav data-auth-only style="display:none;">Profile</a>
      <a href="login.html" data-guest-only>Sign In</a>
  </div>

  <main class="main-panel">
    <header class="app-header">
      <h1 id="course-code">Course</h1>
      <p id="course-name">Loading...</p>
    </header>
    <div id="flash-container"></div>

    <div class="content">
      <p id="course-meta" class="page-sub"></p>
      <div class="section-heading"><h3 id="tutor-count-heading">Tutors</h3></div>
      <div id="tutor-list" class="tutor-list"></div>
      <div id="empty-state" class="empty-state" style="display:none;">
        <p>No tutors have listed this course yet.</p>
        <p><a href="teach.html" style="color: var(--blue); font-weight: 700;">Be the first to teach it</a></p>
      </div>
    </div>
  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const courseCode = params.get("code");

    async function load() {
      if (!courseCode) return;

      const { data: course } = await supabaseClient
        .from("course_catalog")
        .select("*")
        .eq("code", courseCode)
        .single();

      if (!course) {
        showFlash("Couldn't find that course.", "error");
        return;
      }

      document.title = `${course.code} · Zaynextutor`;
      document.getElementById("course-code").textContent = course.code;
      document.getElementById("course-name").textContent = course.name;
      document.getElementById("course-meta").textContent = `${course.department} · ${course.level} Level`;

      const { data: listings } = await supabaseClient
        .from("courses")
        .select("*, profiles(full_name, department, level)")
        .eq("course_id", course.id);

      const listEl = document.getElementById("tutor-list");
      const emptyEl = document.getElementById("empty-state");
      document.getElementById("tutor-count-heading").textContent =
        `${(listings || []).length} Tutor${(listings || []).length === 1 ? "" : "s"} Available`;

      if (!listings || listings.length === 0) {
        emptyEl.style.display = "";
        return;
      }
      emptyEl.style.display = "none";

      listings.forEach((l) => {
        const name = l.profiles?.full_name || "Unknown tutor";
        const card = document.createElement("div");
        card.className = "tutor-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.innerHTML = `
          <div class="avatar">${name[0]?.toUpperCase() || "?"}</div>
          <div class="tutor-info">
            <p class="name">${name}</p>
            <p class="meta">${l.level ? l.level + " Level" : "Level not set"}</p>
            <p class="meta" style="margin-top:2px;">${l.topics || "General help"}</p>
            <p class="meta" style="margin-top:2px;">${l.availability === "accepting" ? "Accepting learners" : "Not accepting right now"}</p>
          </div>
        `;
        const go = () => (window.location.href = `tutor.html?id=${l.tutor_id}&course=${course.code}`);
        card.addEventListener("click", go);
        card.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
        listEl.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      initMobileMenu();
      await renderNav();
      await load();
    });
  </script>
</body>
</html>
