<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password · Zaynextutor</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap desktop-center">
    <div id="flash-container"></div>
    <div class="auth-inner">
      <div class="auth-copy">
                <h1>Set a New Password</h1>
        <p class="sub">Choose a new password for your account.</p>
      </div>
      <div class="form-card">
        <div id="reset-form-wrap">
          <form id="reset-form">
            <div class="field"><label>New Password</label><input type="password" id="new-password" minlength="6" required></div>
            <div class="field"><label>Confirm Password</label><input type="password" id="confirm-password" minlength="6" required></div>
            <button type="submit" class="btn-primary">Update Password</button>
          </form>
        </div>
        <p class="auth-switch"><a href="login.html">Back to Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // Supabase auto-parses the recovery token in the URL and fires PASSWORD_RECOVERY
    let recoveryReady = false;
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") recoveryReady = true;
    });

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (newPassword !== confirmPassword) {
        showFlash("Passwords don't match.", "error");
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        showFlash(`Couldn't update password: ${error.message}. The reset link may have expired — request a new one.`, "error");
        return;
      }

      document.getElementById("reset-form-wrap").innerHTML = `
        <p style="font-weight:700; margin-bottom:8px;">Password updated!</p>
        <p class="section-hint">You can now sign in with your new password.</p>
      `;
      setTimeout(() => (window.location.href = "login.html"), 2000);
    });
  </script>
</body>
</html>
