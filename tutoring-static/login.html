<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Zaynextutor</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap desktop-center">
    <div id="flash-container"></div>
    <div class="auth-inner">
      <div class="auth-copy">
        <span class="brand-text auth-brand"><span class="brand-word">zayn<span class="brand-accent">ex</span></span><span class="brand-sub">TUTOR</span></span>
        <h1>Welcome Back</h1>
        <p class="sub">Sign in to browse or teach on Zaynextutor.</p>
      </div>
      <div class="form-card">
        <form id="login-form">
          <div class="field"><label>Email</label><input type="email" id="email" required></div>
          <div class="field"><label>Password</label><input type="password" id="password" required></div>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
        <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
        <p class="auth-switch" style="margin-top:8px;"><a href="forgot-password.html" style="color:var(--blue);">Forgot password?</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        showFlash(`Sign in failed: ${error.message}`, "error");
        return;
      }
      window.location.href = "discover.html";
    });
  </script>
</body>
</html>
