<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password · Zaynextutor</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap desktop-center">
    <div id="flash-container"></div>
    <div class="auth-inner">
      <div class="auth-copy">
                <h1>Reset Your Password</h1>
        <p class="sub">Enter your email and we'll send you a reset link.</p>
      </div>
      <div class="form-card">
        <form id="forgot-form">
          <div class="field"><label>Email</label><input type="email" id="email" required></div>
          <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>
        <p class="auth-switch">Remembered it? <a href="login.html">Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Sending...";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname.replace("forgot-password.html", "reset-password.html"),
      });

      if (error) {
        showFlash(`Couldn't send reset link: ${error.message}`, "error");
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
        return;
      }

      document.getElementById("forgot-form").innerHTML = `
        <p style="font-weight:700; margin-bottom:8px;">Check your email</p>
        <p class="section-hint">If an account exists for ${email}, a password reset link is on its way.</p>
      `;
    });
  </script>
</body>
</html>
